<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transgender or Not</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Transgender or Not</h1>
    <div class="score-box">Score: <span id="score">0</span> / <span id="max-score">20</span></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="round-label">Round <span id="round-num">1</span> of 20</p>

    <div class="image-frame" id="image-frame" data-tooltip="Is this person transgender?">
      <img id="person-img" src="" alt="Who is this?" />
      <div class="result-overlay" id="result-overlay"></div>
    </div>

    <div class="vote-buttons" id="vote-buttons">
      <button class="vote-btn" id="btn-trans" onclick="vote('trans')" data-tooltip="Guess: This person IS transgender">
        <span class="vote-icon">
          <svg class="vote-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 16.5V22"/>
            <path d="M9.5 19.5h5"/>
            <path d="M15.2 8.8L20.5 3.5"/>
            <path d="M20.5 3.5h-4.5"/>
            <path d="M20.5 3.5v4.5"/>
            <path d="M8.8 8.8L3.5 3.5"/>
            <path d="M3.5 3.5h4.5"/>
            <path d="M3.5 3.5v4.5"/>
            <path d="M17.5 4.5l-2.5 2.5"/>
            <path d="M6.5 4.5l2.5 2.5"/>
          </svg>
        </span>
        <span class="vote-label">Transgender</span>
      </button>
      <button class="vote-btn" id="btn-cis" onclick="vote('cis')" data-tooltip="Guess: This person is NOT transgender">
        <span class="vote-icon">
          <svg class="vote-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="vote-label">Not Trans</span>
      </button>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="nextRound()" disabled>Select your Vote</button>

    <div class="end-screen" id="end-screen" style="display:none">
      <h2>Day Complete!</h2>
      <p>You scored <span id="final-score">0</span></p>
      <p class="reset-timer">New images in: <span id="countdown"></span></p>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
        <button class="submit-btn" onclick="restartDay()">Play Again</button>
        <button class="submit-btn" onclick="shareScore()">Share Score</button>
      </div>
    </div>

    <a href="admin.html" class="admin-link">Admin Panel</a>
  </div>

  <script src="pool.js"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
