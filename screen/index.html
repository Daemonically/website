<!DOCTYPE html>
<html>
<head>
  <title>🔴 tarnish.lol/screen - Native Window Share</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#0f3460);animation:gradient 8s infinite;color:#00ff88;font-family:'Orbitron',monospace;height:100vh;overflow:hidden;}
    h1{font-size:3em;text-shadow:0 0 30px #00ff88;animation:glow 2s infinite alternate;text-align:center;padding:40px 20px;}
    #viewer{width:98vw;height:70vh;border:3px solid #00ff88;border-radius:20px;margin:2vw auto;display:block;background:#000;box-shadow:0 0 50px #00ff88;}
    button{background:linear-gradient(45deg,#00ff88,#00cc6a);color:#000;border:none;padding:20px 40px;font-size:18px;border-radius:50px;cursor:pointer;font-weight:bold;transition:all 0.3s;box-shadow:0 10px 30px rgba(0,255,136,0.4);}
    button:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,255,136,0.6);}
    .status{color:#ff0;font-size:1.2em;text-align:center;margin:20px;}
    .instructions{color:#ffaa00;font-size:1.1em;text-align:center;max-width:800px;margin:0 auto;}
    @keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @keyframes glow{from{text-shadow:0 0 20px #00ff88}to{text-shadow:0 0 40px #00ff88}}
  </style>
</head>
<body>
  <h1>🔴 tarnish.lol/screen</h1>
  <div class="instructions">
    <strong>PC:</strong> Click SHARE → Pick G HUB Lua → Send room code<br>
    <strong>Phone:</strong> Enter room code → Watch live!
  </div>
  <div style="text-align:center;">
    <button id="shareBtn" onclick="toggleShare()">📱 SHARE WINDOW</button>
    <div id="status" class="status">Room code appears after share</div>
  </div>
  <iframe id="viewer" src="https://vdo.ninja/?room=START"></iframe>

  <script>
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const shareBtn = document.getElementById('shareBtn');
    let roomId = location.hash.slice(1) || 'TARNISH';
    
    function toggleShare() {
      if (viewer.src.includes('?room=')) {
        // Stop
        viewer.src = 'https://vdo.ninja/?room=START';
        status.innerText = 'Stopped';
        shareBtn.innerText = '📱 SHARE WINDOW';
        location.hash = '';
      } else {
        // Start
        roomId = Math.random().toString(36).slice(2,8).toUpperCase();
        location.hash = roomId;
        viewer.src = `https://vdo.ninja/?room=${roomId}`;
        status.innerText = `✅ LIVE! Phone: vdo.ninja/?room=${roomId} or tarnish.lol/screen#${roomId}`;
        shareBtn.innerText = '🔴 Stop Share';
      }
    }
    
    // Auto-load room if provided
    if (roomId !== 'START') {
      viewer.src = `https://vdo.ninja/?room=${roomId}`;
      status.innerText = `Viewer mode: room ${roomId}`;
      shareBtn.style.display = 'none';
    }
  </script>
</body>
</html>
