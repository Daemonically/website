<!DOCTYPE html>
<html>
<head>
  <title>🔗 tarnish.lol/share - WORKING VERSION</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#0f3460);animation:gradient 8s infinite;color:#00ff88;font-family:'Orbitron',monospace;min-height:100vh;}
    h1{font-size:3em;text-shadow:0 0 30px #00ff88;animation:glow 2s infinite alternate;text-align:center;padding:30px 20px;}
    #dropzone{width:90%;max-width:700px;height:400px;border:4px dashed #00ff88;border-radius:25px;margin:30px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,255,136,0.1);transition:all 0.3s;transition-property:box-shadow,border-color;}
    #dropzone.dragover{border-color:#ff0;background:rgba(255,255,0,0.2);transform:scale(1.02);}
    #dropzone:hover{box-shadow:0 0 60px #00ff88;}
    #result{text-align:center;margin:50px;display:none;}
    #result h3{font-size:2.5em;color:#00ff88;margin-bottom:30px;text-shadow:0 0 30px #00ff88;}
    .share-link{display:block;font-size:1.8em;font-weight:bold;color:#00ff88;text-decoration:none;padding:25px;border-radius:20px;background:rgba(0,255,136,0.25);margin:30px auto;max-width:600px;border:3px solid #00ff88;transition:all 0.3s;}
    .share-link:hover{color:#ff0;box-shadow:0 0 70px #00ff88;transform:scale(1.05);}
    .copy-btn{background:linear-gradient(45deg,#00ff88,#00cc6a);color:#000;border:none;padding:20px 50px;font-size:20px;border-radius:50px;cursor:pointer;font-weight:bold;margin:20px auto;display:block;transition:all 0.3s;box-shadow:0 15px 40px rgba(0,255,136,0.5);}
    .copy-btn:hover{transform:translateY(-5px);box-shadow:0 25px 50px rgba(0,255,136,0.7);}
    .copy-btn:active{transform:translateY(-2px);}
    .file-info{margin:20px 0;color:#ffaa00;font-size:1.2em;}
    button{background:linear-gradient(45deg,#00ff88,#00cc6a);color:#000;border:none;padding:20px 50px;font-size:18px;border-radius:50px;cursor:pointer;font-weight:bold;transition:all 0.3s;box-shadow:0 15px 40px rgba(0,255,136,0.4);margin:20px auto;display:block;}
    button:disabled{opacity:0.5;cursor:not-allowed;}
    .status{color:#ffaa00;font-size:1.3em;text-align:center;padding:20px;}
    input[type=file]{display:none;}
    .progress-bar{display:none;width:90%;height:10px;background:rgba(0,0,0,0.5);border-radius:10px;margin:20px auto;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00cc6a);}
    @keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @keyframes glow{from{text-shadow:0 0 20px #00ff88}to{text-shadow:0 0 40px #00ff88}}
  </style>
</head>
<body>
  <h1>🔗 tarnish.lol/share</h1>
  <div class="status">Drag files or <label for="fileInput" style="color:#00ff88;border-bottom:2px solid #00ff88;cursor:pointer;">CLICK HERE</label></div>
  
  <div id="dropzone">
    <div>📁 Drop files here</div>
    <div style="font-size:1em;margin-top:15px;color:#ffaa00;">ZIP/Videos/Games → Share link</div>
  </div>
  
  <div id="progress" class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  
  <input type="file" id="fileInput" multiple style="display:none;">
  <button id="uploadBtn" disabled>🚀 UPLOAD</button>
  
  <div id="result"></div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const result = document.getElementById('result');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const status = document.querySelector('.status');
    let files = [];

    function setStatus(text) {
      status.textContent = text;
    }

    async function createZip(files) {
      const zip = new JSZip();
      files.forEach(f => zip.file(f.name, f));
      return zip.generateAsync({type: 'blob'});
    }

    function handleFiles(f) {
      files = Array.from(f);
      const size = files.reduce((a,b)=>a+b.size,0);
      if(size > 2e9) return setStatus('Too large!');
      setStatus(files.length===1 ? files[0].name : `${files.length} files ready`);
      uploadBtn.disabled = false;
      result.style.display = 'none';
    }

    // Click label
    document.querySelector('label').onclick = () => fileInput.click();
    fileInput.onchange = e => handleFiles(e.target.files);

    // Drag & drop
    dropzone.ondragover = dropzone.ondragenter = e => {
      e.preventDefault(); dropzone.style.borderColor = '#ff0'; dropzone.style.background = 'rgba(255,255,0,0.2)';
    };
    dropzone.ondragleave = dropzone.ondrop = e => {
      dropzone.style.borderColor = '#00ff88'; dropzone.style.background = 'rgba(0,255,136,0.1)';
      if(e.type==='drop') handleFiles(e.dataTransfer.files);
    };

    uploadBtn.onclick = async () => {
      uploadBtn.disabled = true;
      setStatus('Uploading...');
      progress.style.display = 'block';
      result.style.display = 'none';

      try {
        let blob = files[0];
        let name = files[0].name;
        if(files.length > 1) {
          setStatus('Zipping...');
          blob = await createZip(files);
          name = 'archive.zip';
        }

        progressFill.style.width = '30%';
        setStatus('Sending to GitHub...');

        // Base64 upload to GitHub Gist (always works, free, public)
        const reader = new FileReader();
        reader.onload = async () => {
          const b64 = reader.result.split(',')[1];
          progressFill.style.width = '60%';

          const gistData = {
            description: 'tarnish.lol/share upload',
            public: true,
            files: {[name]: {content: b64}}
          };

          const res = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: {'Accept': 'application/vnd.github.v3+json'},
            body: JSON.stringify(gistData)
          });

          if(!res.ok) throw new Error(await res.text());

          const gist = await res.json();
          const shareUrl = gist.html_url + '/raw';
          
          progressFill.style.width = '100%';
          setStatus('Complete!');

          result.innerHTML = `
            <h3>✅ Shared!</h3>
            <a href="${shareUrl}" class="share-link" target="_blank">${shareUrl}</a>
            <br><button class="copy-btn" onclick="navigator.clipboard.writeText('${shareUrl}').then(()=>this.textContent='Copied!')">Copy Link</button>
            <div class="file-info">${name}</div>
            <div>Download & delete gist manually if needed</div>
          `;
          result.style.display = 'block';
        };
        reader.readAsDataURL(blob);

      } catch(e) {
        setStatus('Error: ' + e.message);
        console.error(e);
      }

      setTimeout(() => { uploadBtn.disabled = false; uploadBtn.textContent = 'NEW UPLOAD'; }, 2000);
    };
  </script>
</body>
</html>
