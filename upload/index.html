<!DOCTYPE html>
<html>
<head>
  <title>🔗 tarnish.lol/share - File Sharer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#0f3460);animation:gradient 8s infinite;color:#00ff88;font-family:'Orbitron',monospace;min-height:100vh;}
    h1{font-size:3em;text-shadow:0 0 30px #00ff88;animation:glow 2s infinite alternate;text-align:center;padding:30px 20px;}
    #dropzone{width:90%;max-width:700px;height:400px;border:4px dashed #00ff88;border-radius:25px;margin:30px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,255,136,0.1);transition:all 0.3s;cursor:pointer;font-size:1.3em;}
    #dropzone.dragover{border-color:#ff0;background:rgba(255,255,0,0.2);transform:scale(1.02);}
    #dropzone:hover{box-shadow:0 0 60px #00ff88;}
    #result{text-align:center;margin:50px;display:none;}
    #result h3{font-size:2.5em;color:#00ff88;margin-bottom:30px;text-shadow:0 0 30px #00ff88;}
    .share-link{display:block;font-size:1.8em;font-weight:bold;color:#00ff88;text-decoration:none;padding:25px;border-radius:20px;background:rgba(0,255,136,0.25);margin:30px auto;max-width:600px;border:3px solid #00ff88;transition:all 0.3s;box-shadow:0 0 40px rgba(0,255,136,0.4);}
    .share-link:hover{color:#ff0;box-shadow:0 0 70px #00ff88;transform:scale(1.05);}
    .copy-btn{background:linear-gradient(45deg,#00ff88,#00cc6a);color:#000;border:none;padding:20px 50px;font-size:20px;border-radius:50px;cursor:pointer;font-weight:bold;margin:20px auto;display:block;transition:all 0.3s;box-shadow:0 15px 40px rgba(0,255,136,0.5);}
    .copy-btn:hover{transform:translateY(-5px);box-shadow:0 25px 50px rgba(0,255,136,0.7);}
    .copy-btn:active{transform:translateY(-2px);}
    .file-info{margin:20px 0;color:#ffaa00;font-size:1.2em;}
    button{background:linear-gradient(45deg,#00ff88,#00cc6a);color:#000;border:none;padding:20px 50px;font-size:18px;border-radius:50px;cursor:pointer;font-weight:bold;transition:all 0.3s;box-shadow:0 15px 40px rgba(0,255,136,0.4);margin:20px auto;display:block;}
    button:disabled{opacity:0.5;cursor:not-allowed;}
    .status{color:#ffaa00;font-size:1.3em;text-align:center;padding:20px;}
    input[type=file]{display:none;}
    .progress-bar{display:none;width:90%;height:10px;background:rgba(0,0,0,0.5);border-radius:10px;margin:20px auto;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00cc6a);transition:width 0.3s;}
    @keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @keyframes glow{from{text-shadow:0 0 20px #00ff88}to{text-shadow:0 0 40px #00ff88}}
  </style>
</head>
<body>
  <h1>🔗 tarnish.lol/share</h1>
  <div class="status">Drag ANY file or <label for="fileInput" style="color:#00ff88;border-bottom:2px solid #00ff88;cursor:pointer;">CLICK TO SELECT</label> (Up to 2GB free)</div>
  
  <div id="dropzone">
    <div>📁 Drop files here</div>
    <div style="font-size:1em;margin-top:15px;color:#ffaa00;">ZIP/Videos/Games → One-time shareable link</div>
  </div>
  
  <div id="progress" class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  
  <div style="text-align:center;">
    <input type="file" id="fileInput" multiple>
    <button id="uploadBtn" disabled>🚀 SHARE FILES</button>
  </div>
  
  <div id="result"></div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const result = document.getElementById('result');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    let files = [];

    function updateStatus(msg) {
      document.querySelector('.status').innerText = msg;
    }

    async function zipFiles(files) {
      const zip = new JSZip();
      for (const file of files) {
        zip.file(file.name, file);
      }
      const zipBlob = await zip.generateAsync({type: 'blob'});
      return new File([zipBlob], files.length > 1 ? 'files.zip' : files[0].name, {type: 'application/zip'});
    }

    function handleFiles(selectedFiles) {
      files = Array.from(selectedFiles);
      const totalSize = files.reduce((sum, f) => sum + f.size, 0);
      if (totalSize > 2 * 1024 * 1024 * 1024) return updateStatus('Too big! Max 2GB');
      const fileText = files.length > 1 ? `${files.length} files` : files[0].name;
      updateStatus(`${fileText} (${(totalSize/1024/1024).toFixed(1)}MB) ready`);
      uploadBtn.disabled = false;
    }

    document.querySelector('label').onclick = () => fileInput.click();
    fileInput.onchange = e => handleFiles(e.target.files);

    // Drag-drop
    ['dragenter','dragover'].forEach(e => dropzone.addEventListener(e, ev => {ev.preventDefault(); dropzone.classList.add('dragover');}));
    ['dragleave','drop'].forEach(e => dropzone.addEventListener(e, ev => {ev.preventDefault(); dropzone.classList.remove('dragover');}));
    dropzone.addEventListener('drop', e => {
      handleFiles(e.dataTransfer.files);
    });

    uploadBtn.onclick = async () => {
      uploadBtn.disabled = true;
      progress.style.display = 'block';
      updateStatus('Preparing & Uploading...');
      let progressInterval;

      try {
        let uploadFile = files[0];
        if (files.length > 1) {
          updateStatus('Zipping files...');
          uploadFile = await zipFiles(files);
        }

        const formData = new FormData();
        formData.append('file', uploadFile);

        const res = await fetch('https://file.io', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success && data.link) {
          const shareLink = `https://tarnish.lol/share/${data.link.split('/').pop()}`;
          const fileInfo = files.length > 1 ? 'All files (zipped)' : `${files[0].name} (${(files[0].size/1024/1024).toFixed(1)}MB)`;
          result.innerHTML = `
            <div>
              <h3>✅ Files Shared!</h3>
              <div style="font-size:1.2em;color:#ffaa00;margin-bottom:20px;">One-time download (deletes after 1 use, expires ${data.expiry || '14 days'})</div>
              <a href="${data.link}" class="share-link" target="_blank">${shareLink}</a>
              <button class="copy-btn" onclick="navigator.clipboard.writeText('${shareLink}').then(()=>this.innerText='✅ COPIED!')">📋 COPY SHARE LINK</button>
              <div class="file-info">${fileInfo}</div>
            </div>
          `;
        } else {
          throw new Error(data.status || 'Upload failed');
        }
      } catch (err) {
        updateStatus(`Error: ${err.message} - Try again`);
      }
      result.style.display = 'block';
      progress.style.display = 'none';
      uploadBtn.disabled = false;
      uploadBtn.innerText = '🚀 NEW SHARE';
    };
  </script>
</body>
</html>
