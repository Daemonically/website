<!DOCTYPE html>
<html>
<head>
  <title>tarnish.lol/cs2 Radar</title>
  <style>
    body { background: #111; color: #0ff; font-family: monospace; text-align: center; padding: 50px; }
    input { background: #222; color: #0ff; border: 2px solid #0ff; padding: 15px; font-size: 20px; width: 300px; }
    button { background: #0f0; color: #000; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; }
    iframe { width: 100%; height: 80vh; border: none; background: #000; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🧭 tarnish.lol/cs2 Radar</h1>
  <p>Enter session code:</p>
  <input type="text" id="code" placeholder="xxxxx" maxlength="10">
  <button onclick="loadRadar()">Load Radar</button>
  <iframe id="radar" src=""></iframe>

  <script>
    function loadRadar() {
      const code = document.getElementById('code').value.trim();
      if (code) {
        document.getElementById('radar').src = `https://radar.valth.run/session/${code}`;
      }
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('code')) {
      document.getElementById('code').value = urlParams.get('code');
      loadRadar();
    }
  </script>
</body>
</html>[web:507]
