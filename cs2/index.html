<!DOCTYPE html>
<html>
<head>
  <title>tarnish.lol/cs2 Radar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f3460);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: #00ff88; 
      font-family: 'Orbitron', monospace; 
      text-align: center; 
      padding: 20px; 
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .particle { position: absolute; width: 4px; height: 4px; background: #00ff88; border-radius: 50%; animation: float 20s linear infinite; }
    
    
    .controls { position: fixed; top: 20px; right: 20px; background: rgba(0,255,136,0.1); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); z-index: 100; }
    .settings-btn { background: none; border: none; color: #00ff88; font-size: 24px; cursor: pointer; margin-bottom: 10px; }
    .slider { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); outline: none; -webkit-appearance: slider-vertical; writing-mode: bt-lr; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #00ff88; border-radius: 50%; cursor: pointer; }
    
    h1 { font-size: 2.2em; font-weight: 700; text-shadow: 0 0 20px #00ff88; margin: 20px 0; position: relative; z-index: 10; animation: glow 2s ease-in-out infinite alternate; }
    p { font-size: 1.1em; margin-bottom: 20px; position: relative; z-index: 10; }
    
    input { background: rgba(0,255,136,0.1); color: #00ff88; border: 2px solid #00ff88; padding: 18px; font-size: 18px; width: 320px; backdrop-filter: blur(10px); transition: all 0.3s; position: relative; z-index: 10; }
    input:focus { box-shadow: 0 0 30px #00ff88; outline: none; transform: scale(1.02); }
    
    button { background: linear-gradient(45deg, #00ff88, #00cc6a); color: #000; border: none; padding: 18px 35px; font-size: 16px; cursor: pointer; margin: 10px; border-radius: 50px; font-weight: bold; transition: all 0.3s; position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,255,136,0.3); }
    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 15px 35px rgba(0,255,136,0.5); }
    
    #radar { width: 100%; height: 70vh; border: 3px solid #00ff88; border-radius: 20px; background: #000; margin: 20px 0; box-shadow: 0 0 50px rgba(0,255,136,0.5); position: relative; z-index: 10; transition: height 0.3s ease; }
    
    @keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes glow { from{text-shadow:0 0 20px #00ff88} to{text-shadow:0 0 30px #00ff88,0 0 40px #00ff88} }
    @keyframes float { 0%{transform:translateY(100vh) rotate(0deg);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-100px) rotate(360deg);opacity:0} }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  
  <div class="controls" id="controls" style="display:none;">
    <button class="settings-btn" onclick="toggleControls()" title="Settings">⚙️</button>
    <br>
    <label>Size:</label><br>
    <input type="range" class="slider" id="sizeSlider" min="40" max="100" value="70" orient="vertical" onchange="updateSize()">
    <div style="font-size:12px;margin-top:5px;">40% - 100% height</div>
  </div>
  
  <h1>🧭 tarnish.lol / CS2 RADAR</h1>
  <p>Enter session code:</p>
  <input type="text" id="code" placeholder="xxxx" maxlength="10" autofocus>
  <br>
  <button onclick="loadRadar()">🚀 LOAD RADAR</button>
  <button class="settings-btn" onclick="toggleControls()" title="Resize" style="font-size:16px;">⚙️</button>
  
  <iframe id="radar" src="" allowfullscreen></iframe>

  <script>
    
    function createParticles() {
      const particles = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 20 + 's';
        p.style.animationDuration = (Math.random() * 10 + 10) + 's';
        particles.appendChild(p);
      }
    }
    createParticles();

    let controlsVisible = false;
    function toggleControls() {
      controlsVisible = !controlsVisible;
      document.getElementById('controls').style.display = controlsVisible ? 'block' : 'none';
    }

    function updateSize() {
      const size = document.getElementById('sizeSlider').value;
      document.getElementById('radar').style.height = size + 'vh';
    }

    function loadRadar() {
      const code = document.getElementById('code').value.trim();
      if (code) {
        document.getElementById('radar').src = `https://radar.valth.run/session/${code}`;
        document.getElementById('code').blur();
      }
    }
    
    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('code')) {
      document.getElementById('code').value = urlParams.get('code');
      loadRadar();
    }
    document.getElementById('code').addEventListener('keypress', e => { if(e.key==='Enter') loadRadar(); });
  </script>
</body>
</html>[file:537]
