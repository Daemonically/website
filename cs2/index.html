<!DOCTYPE html>
<html>
<head>
  <title>tarnish.lol/cs2 Radar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f3460);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: #00ff88; 
      font-family: 'Orbitron', monospace; 
      text-align: center; 
      padding: 50px; 
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    .particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      pointer-events: none; z-index: 1;
    }
    .particle {
      position: absolute; width: 4px; height: 4px; background: #00ff88; 
      border-radius: 50%; animation: float 20s linear infinite;
    }
    
    h1 { 
      font-size: 2.5em; font-weight: 700; 
      text-shadow: 0 0 20px #00ff88; 
      margin-bottom: 20px; 
      animation: glow 2s ease-in-out infinite alternate;
      position: relative; z-index: 10;
    }
    
    p { font-size: 1.2em; margin-bottom: 20px; position: relative; z-index: 10; }
    
    input { 
      background: rgba(0,255,136,0.1); 
      color: #00ff88; 
      border: 2px solid #00ff88; 
      padding: 20px; 
      font-size: 20px; 
      width: 350px; 
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative; z-index: 10;
    }
    input:focus { 
      box-shadow: 0 0 30px #00ff88; 
      outline: none; 
      transform: scale(1.05);
    }
    
    button { 
      background: linear-gradient(45deg, #00ff88, #00cc6a); 
      color: #000; 
      border: none; 
      padding: 20px 40px; 
      font-size: 18px; 
      cursor: pointer; 
      margin: 10px; 
      border-radius: 50px;
      font-weight: bold;
      transition: all 0.3s ease;
      position: relative; z-index: 10;
      box-shadow: 0 10px 30px rgba(0,255,136,0.3);
    }
    button:hover { 
      transform: translateY(-5px) scale(1.05); 
      box-shadow: 0 20px 40px rgba(0,255,136,0.5);
    }
    
    iframe { 
      width: 100%; 
      height: 70vh; 
      border: 3px solid #00ff88; 
      border-radius: 20px; 
      background: #000; 
      margin-top: 30px; 
      box-shadow: 0 0 50px rgba(0,255,136,0.5);
      position: relative; z-index: 10;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes glow {
      from { text-shadow: 0 0 20px #00ff88; }
      to { text-shadow: 0 0 30px #00ff88, 0 0 40px #00ff88; }
    }
    
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  
  <div class="particles" id="particles"></div>
  
  <h1>🧭 tarnish.lol / CS2 RADAR</h1>
  <p>Enter session code:</p>
  <input type="text" id="code" placeholder="xxxxx" maxlength="10" autofocus>
  <br>
  <button onclick="loadRadar()">🚀 LOAD RADAR</button>
  
  <iframe id="radar" src="" allowfullscreen></iframe>

  <script>
    function createParticles() {
      const particles = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        particles.appendChild(particle);
      }
    }
    createParticles();

    function loadRadar() {
      const code = document.getElementById('code').value.trim();
      if (code) {
        document.getElementById('radar').src = `https://radar.valth.run/session/${code}`;
        document.getElementById('code').blur();  
      }
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('code')) {
      document.getElementById('code').value = urlParams.get('code');
      loadRadar();
    }
    
    // Enter key support
    document.getElementById('code').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loadRadar();
    });
  </script>
</body>
</html>
